[package]
name="jbrs"
version="0.7.3"
edition="2021"
[dependencies]
procedural_audio={path="../procedural_audio"}
roads={path="../roads"}
vehicle_physics={path="../vehicle_physics"}
world={path="../world"}
police={path="../police"}
save_system={path="../save_system"}
minimap={path="../minimap"}
engine_core={path="../engine_core"}
gui={path="../gui"}
profiling={path="../profiling"}
shader_pack={path="../shader_pack"}
player={path="../player"}
renderer_gles2={path="../renderer_gles2"}
mobile_controls={path="../mobile_controls"}
vehicles={path="../vehicles"}
robberies={path="../robberies"}
economy={path="../economy"}
weapons={path="../weapons"}
criminals={path="../criminals"}

buildings={path="../buildings"}

terrain={path="../terrain"}

[features]
gles=["gui/gles"]

[target.'cfg(not(target_os="android"))'.dependencies]
renderer_gl21={path="../renderer_gl21"}

[lib]
name="jbrs"
path="src/lib.rs"
crate-type=["cdylib","rlib"]
